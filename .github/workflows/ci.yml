
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-ci:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    uses: ./.github/workflows/reusable-python-ci.yml

    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}

