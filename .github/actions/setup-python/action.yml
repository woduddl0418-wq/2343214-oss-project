
name: Setup Python Environment
description: Set up Python and install Ruff

inputs:
  python-version:
    description: Python version to install
    required: true
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Ruff
      shell: bash
      run: python -m pip install ruff
