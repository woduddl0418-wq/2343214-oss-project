
name: Setup Python Environment
description: Set up Python and install Ruff

inputs:
  python-version:
    description: Python version to install
    required: true
    default: "3.11"

runs:
  using: composite
  steps:
          - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ inputs.python-version }}
